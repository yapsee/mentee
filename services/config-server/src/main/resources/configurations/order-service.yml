server:
  port: 8070

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/order_db
    username: ${POSTGRES_USER:ecom}
    password: ${POSTGRES_PASSWORD:ecom}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    open-in-view: false
  flyway:
    baseline-on-migrate: true

application:
  config:
    # http://<eureka service id>/...: resolved by Spring Cloud LoadBalancer, not DNS.
    product-url: http://product-service/api/v1/products
    # customer-service is called with OpenFeign: @FeignClient(name = "customer-service") needs no URL.

server:
  port: 8070

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/order_db
    username: ${POSTGRES_USER:ecom}
    password: ${POSTGRES_PASSWORD:ecom}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    open-in-view: false
  flyway:
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Spring Kafka 4 / Jackson 3 (older tutorials: JsonSerializer, now deprecated).
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # Header __TypeId__ = "orderConfirmation" instead of the Java class name, so the consumer
        # maps it to its own class and no Java code is shared between services.
        spring.json.type.mapping: orderConfirmation:com.ecom.order.kafka.OrderConfirmation
        # Fail fast when Kafka is down instead of blocking the HTTP request for 60 s.
        max.block.ms: 5000

application:
  config:
    # http://<eureka service id>/...: resolved by Spring Cloud LoadBalancer, not DNS.
    product-url: http://product-service/api/v1/products
    # customer-service is called with OpenFeign: @FeignClient(name = "customer-service") needs no URL.

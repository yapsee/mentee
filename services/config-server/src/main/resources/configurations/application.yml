# Shared by every service that imports config from the config server.
# A service-specific file (e.g. customer-service.yml) overrides anything here.

eureka:
  instance:
    hostname: ${EUREKA_HOST:localhost}
  client:
    service-url:
      defaultZone: http://${eureka.instance.hostname}:8761/eureka/

spring:
  cloud:
    config:
      # Let -D flags and env vars override values coming from the config server.
      override-system-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0   # used from Day 10 (Zipkin)

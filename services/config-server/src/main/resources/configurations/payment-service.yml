server:
  port: 8060

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/payment_db
    username: ${POSTGRES_USER:ecom}
    password: ${POSTGRES_PASSWORD:ecom}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    open-in-view: false
  flyway:
    baseline-on-migrate: true

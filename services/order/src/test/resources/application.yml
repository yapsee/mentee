# Tests run without config-server or Eureka. The database comes from Testcontainers.
spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    # No broker in these tests: don't try to create topics at startup. The producer is mocked.
    admin:
      auto-create: false
eureka:
  client:
    enabled: false
application:
  config:
    product-url: http://product-service/api/v1/products

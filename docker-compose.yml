# Infrastructure for the e-commerce microservices.
# Day 1: databases, broker, tracing and mail only. Services are added on Day 10.
#
#   docker compose up -d      start everything
#   docker compose ps         check health
#   docker compose down       stop (data stays in volumes)
#   docker compose down -v    stop and wipe all data

name: ecom-ms

services:

  # ---------- Relational: product, order, payment ----------
  postgres:
    image: postgres:16-alpine
    container_name: ecom-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ecom-net]
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ecom-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ecom.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ecom-net]
    restart: unless-stopped

  # ---------- Documents: customer, notification ----------
  mongodb:
    image: mongo:7
    container_name: ecom-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ecom}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ecom}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ecom-net]
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ecom-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-ecom}:${MONGO_PASSWORD:-ecom}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-admin}
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [ecom-net]
    restart: unless-stopped

  # ---------- Message broker (KRaft mode, no Zookeeper) ----------
  kafka:
    image: apache/kafka:3.8.0
    container_name: ecom-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: other containers use kafka:29092. EXTERNAL: your laptop uses localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker, so every internal topic has 1 replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [ecom-net]
    restart: unless-stopped

  # ---------- Distributed tracing ----------
  zipkin:
    image: openzipkin/zipkin:3
    container_name: ecom-zipkin
    ports:
      - "9411:9411"
    networks: [ecom-net]
    restart: unless-stopped

  # ---------- Fake SMTP server for notification emails ----------
  maildev:
    image: maildev/maildev:2.1.0
    container_name: ecom-maildev
    ports:
      - "1080:1080"   # web UI
      - "1025:1025"   # SMTP
    networks: [ecom-net]
    restart: unless-stopped

networks:
  ecom-net:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  mongo-data:
  kafka-data:
